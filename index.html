    // Component: Math Equation Renderer
    function MathEquation({ tex, inline = false }) {
      const containerRef = useRef(null);
      useEffect(() => {
        if (containerRef.current) {
          if (typeof window.katex !== "undefined") {
            window.katex.render(tex, containerRef.current, {
              displayMode: !inline,
              throwOnError: false
            });
          } else {
            containerRef.current.textContent = tex;
          }
        }
      }, [tex, inline]);
      return <span ref={containerRef} className="font-mono text-sky-400" />;
    }

    // Custom ML Predictor Evaluators
    function evalMLP(network, scaledX) {
      const W1 = network.W1;
      const b1 = network.b1;
      const W2 = network.W2;
      const b2 = network.b2;
      
      const H = b1.length;
      const hidden = [];
      for (let h = 0; h < H; h++) {
        let z = b1[h];
        for (let i = 0; i < 3; i++) {
          z += scaledX[i] * W1[i][h];
        }
        hidden.push(Math.max(0, z)); // ReLU
      }
      
      let out = b2[0];
      for (let h = 0; h < H; h++) {
        out += hidden[h] * W2[h][0];
      }
      return out;
    }

    function evalTree(node, x) {
      if (node.type === "leaf") {
        return node.value;
      }
      const val = x[node.feature_idx];
      if (val <= node.threshold) {
        return evalTree(node.left, x);
      } else {
        return evalTree(node.right, x);
      }
    }

    function evalForest(forest, x) {
      const preds = forest.map(tree => evalTree(tree, x));
      return preds.reduce((a, b) => a + b, 0) / preds.length;
    }

    function evalPoly(coefs, x) {
      const [x0, x1, x2] = x;
      const polyFeatures = [
        1, 
        x0, x1, x2, 
        x0*x0, x0*x1, x0*x2, 
        x1*x1, x1*x2, 
        x2*x2
      ];
      return coefs.reduce((sum, coef, idx) => sum + coef * polyFeatures[idx], 0);
    }

      const motorPhysicsResults = useMemo(() => {
        const V_ph = voltage / Math.sqrt(3);
        const Ns = (120 * frequency) / 4; 
        const speed = (1 - slip) * Ns;
        const omega_s = (2 * Math.PI * Ns) / 60;
        const omega_m = (2 * Math.PI * speed) / 60;

        const zm_denom = rc * rc + xm * xm;
        const zm_re = (rc * xm * xm) / zm_denom;
        const zm_im = (rc * rc * xm) / zm_denom;

        let Z2_re = 0;
        let Z2_im = x2Prime;
        if (slip > 0) Z2_re = r2Prime / slip;

        const num_re = zm_re * Z2_re - zm_im * Z2_im;
        const num_im = zm_re * Z2_im + zm_im * Z2_re;
        const den_re = zm_re + Z2_re;
        const den_im = zm_im + Z2_im;
        const den_mag2 = den_re * den_re + den_im * den_im;
        
        const zp_re = den_mag2 > 0 ? (num_re * den_re + num_im * den_im) / den_mag2 : 0;
        const zp_im = den_mag2 > 0 ? (num_im * den_re - num_re * den_im) / den_mag2 : 0;

        const zin_re = r1 + zp_re;
        const zin_im = x1 + zp_im;
        const zin_mag2 = zin_re * zin_re + zin_im * zin_im;
        const zin_mag = Math.sqrt(zin_mag2);

        const i1_mag = zin_mag > 0 ? V_ph / zin_mag : 0;
        const pf = zin_mag > 0 ? zin_re / zin_mag : 1.0;
        const theta = Math.acos(pf);

        const p_in = Math.sqrt(3) * voltage * i1_mag * pf; 

        const i1_re = i1_mag * pf;
        const i1_im = -i1_mag * Math.sin(theta);
        const e1_re = V_ph - (i1_re * r1 - i1_im * x1);
        const e1_im = -(i1_re * x1 + i1_im * r1);
        const e1_mag = Math.sqrt(e1_re * e1_re + e1_im * e1_im);

        const z2_mag2 = Z2_re * Z2_re + Z2_im * Z2_im;
        const i2_prime_mag = z2_mag2 > 0 ? e1_mag / Math.sqrt(z2_mag2) : 0;

        const stator_cu_loss = 3 * i1_mag * i1_mag * r1;
        const iron_loss = rc > 0 ? (3 * e1_mag * e1_mag) / rc : 0;
        const rotor_cu_loss = 3 * i2_prime_mag * i2_prime_mag * r2Prime;
        
        const p_ag = slip > 0 ? 3 * i2_prime_mag * i2_prime_mag * (r2Prime / slip) : 0;
        const p_conv = (1 - slip) * p_ag;
        
        let p_out = p_conv - pRot;
        if (p_out < 0) p_out = 0;

        const t_dev = p_ag / omega_s;
        const t_shaft = speed > 0 ? (p_out / omega_m) : 0;
        const eff = p_in > 0 ? (p_out / p_in) * 100 : 0;

        // Visual spring scale values
        const s_drum = activeData[selectedDataset].experimental.R_drum || 0.126;
        const s_diff = t_shaft / (9.81 * s_drum); // (S2 - S1) in kg
        const S1 = Math.max(0.0, loadTorque * 0.15);
        const S2 = S1 + s_diff;

        const winding_temp = 35 + (stator_cu_loss + iron_loss) * 0.05 + loadTorque * 2.8;

        return {
          V_ph, Ns, speed, i1_mag, pf, p_in, e1_mag, i2_prime_mag,
          stator_cu_loss, iron_loss, rotor_cu_loss, p_ag, p_conv, p_out,
          t_dev, t_shaft, eff, S1, S2, winding_temp
        };
      }, [voltage, slip, frequency, r1, r2Prime, x1, x2Prime, xm, rc, pRot, loadTorque, selectedDataset]);

      // Calculate physics metrics for the Alternator

        const Eph = 240 * (aSpeed / 1500.0) * (aIf / 1.05);
        const phi_rad = Math.acos(Math.abs(aPF)) * (aPF < 0 ? -1 : 1); 
        
        const B = 2 * aIa * (aRa * Math.cos(phi_rad) + aXs * Math.sin(phi_rad));
        const C = (aIa**2) * (aRa**2 + aXs**2) - Eph**2;
        const disc = B**2 - 4*C;
        
        const vt_ph = disc >= 0 ? Math.max(20.0, (-B + Math.sqrt(disc)) / 2) : 20.0;
        const vt_line = vt_ph * Math.sqrt(3);
        const vr = ((Eph - vt_ph) / vt_ph) * 100.0;
        
        const p_out = 3.0 * vt_ph * aIa * Math.cos(phi_rad);
        const q_out = 3.0 * vt_ph * aIa * Math.sin(phi_rad);
        const losses = 3 * aIa * aIa * aRa + 250.0;
        const eff = p_out > 0 ? (p_out / (p_out + losses)) * 100.0 : 0.0;
        
        return {
          Eph, vt_ph, vt_line, vr, p_out, q_out, losses, eff

    // Component: Live Oscilloscope
    function Oscilloscope({ frequency, voltage }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animId;
        let phase = 0;

        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          
          ctx.strokeStyle = "rgba(255,255,255,0.06)";
          ctx.lineWidth = 1;
          for(let i=0; i<canvas.width; i+=20) {
            ctx.beginPath();
            ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
            ctx.stroke();
          }
          for(let j=0; j<canvas.height; j+=20) {
            ctx.beginPath();
            ctx.moveTo(0, j); ctx.lineTo(canvas.width, j);
            ctx.stroke();
          }

          const amp = Math.min(30, (voltage / 480) * 30);
          const speed = (frequency / 50) * 0.15;

          const colors = ["#f43f5e", "#fbbf24", "#3b82f6"]; // R, Y, B phases
          for (let p = 0; p < 3; p++) {
            ctx.strokeStyle = colors[p];
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            for (let x = 0; x < canvas.width; x++) {
              const y = canvas.height/2 + amp * Math.sin((x * 0.08) - phase + (p * Math.PI * 2 / 3));
              if (x === 0) ctx.moveTo(x, y);
              else ctx.lineTo(x, y);
            }
            ctx.stroke();
          }

          phase += speed;
          animId = requestAnimationFrame(draw);
        };
        draw();

        return () => cancelAnimationFrame(animId);
      }, [frequency, voltage]);

      return <canvas ref={canvasRef} width="220" height="90" className="w-full h-auto bg-slate-950 rounded border border-slate-900"></canvas>;
    }

    // Component: Curves selector deck tailored to all 7 Semester-5 experiments
    function CurvesDeck({ facility, selectedExpId, sem5PhysicsResults, r1, r2Prime, x1, x2Prime, xm, rc, pRot, voltage, frequency, currentSlip, currentPower, aIf, aIa, aPF, aSpeed, aRa, aXs, alternatorResults }) {

      const getDefaultCurve = (exp) => {
        switch(exp) {
          case "exp2": return "circle-diagram";
          case "exp3": return "speed-voltage";
          case "exp5": return "vt-ia-load";
          case "exp6_a": return "occ-scc";

      };

      const [curveType, setCurveType] = useState(() => getDefaultCurve(activeExp));

      useEffect(() => {
        setCurveType(getDefaultCurve(activeExp));
      }, [activeExp, facility]);

      useEffect(() => {
        if (!containerRef.current || typeof window.Plotly === "undefined") return;

        let traces = [];
        let layout = {
          paper_bgcolor: "rgba(0,0,0,0)",
          plot_bgcolor: "rgba(10, 15, 30, 0.5)",
          font: { color: "#F4F3EF", size: 10 },
          margin: { l: 60, r: 25, t: 25, b: 45 },
          legend: { font: { color: "#94a3b8" }, orientation: "h", y: -0.2 }
        };

        if (activeExp === "exp2") {
          if (curveType === "circle-diagram") {
            const R = 22.8;

            for (let th = -Math.PI / 2; th <= Math.PI / 2; th += 0.05) {
              xCircle.push(cx + R * Math.cos(th));
              yCircle.push(cy + R * Math.sin(th));
            }

            const I0_x = 2.6 * Math.sin(1.39);
            const I0_y = 2.6 * Math.cos(1.39);
            const Isc_x = 25.0 * Math.sin(1.1);
            const Isc_y = 25.0 * Math.cos(1.1);
            const G_x = Isc_x;
            const G_y = I0_y + (Isc_y - I0_y) * 0.52;

            traces = [
              { x: xCircle, y: yCircle, type: 'scatter', mode: 'lines', line: { color: '#fbbf24', width: 2.5 }, name: 'Circle Locus' },
              { x: [0, I0_x], y: [0, I0_y], type: 'scatter', mode: 'lines+markers', line: { color: '#38bdf8', width: 2 }, name: 'No-Load Vector I0' },
              { x: [0, Isc_x], y: [0, Isc_y], type: 'scatter', mode: 'lines+markers', line: { color: '#f43f5e', width: 2 }, name: 'Blocked Rotor Isc' },
              { x: [I0_x, Isc_x], y: [I0_y, Isc_y], type: 'scatter', mode: 'lines', line: { color: '#10b981', dash: 'dash', width: 2 }, name: 'Output Line' },
              { x: [I0_x, G_x], y: [I0_y, G_y], type: 'scatter', mode: 'lines', line: { color: '#a855f7', dash: 'dot', width: 2 }, name: 'Torque Line' },
              { x: [I0_x + 12], y: [I0_y + 14], type: 'scatter', mode: 'markers+text', marker: { color: '#eab308', size: 10 }, text: ['Operating Point P'], textposition: 'top center', name: 'Current Load Point' }
            ];

            layout.xaxis = { title: "Active Current Component Iw (A)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
            layout.yaxis = { title: "Reactive Current Component Iμ (A)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };

          } else if (curveType === "torque-slip") {
            const slips = [], torques = [];
            for (let s = 0.001; s <= 1.0; s += 0.005) {
              const T = (3 * (239.6**2) * (1.8 / s)) / (157.08 * ((1.5 + 1.8 / s)**2 + (3.2 + 3.2)**2));
              slips.push(s * 100);
              torques.push(T);
            }
            traces = [
              { x: slips, y: torques, type: 'scatter', mode: 'lines', line: { color: '#fbbf24', width: 3 }, name: 'Torque-Slip Curve' },

            ];
            layout.xaxis = { title: "Slip (%)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
            layout.yaxis = { title: "Torque (Nm)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
          } else {
            const vsc = [0, 20, 40, 60, 78, 90];
            const isc = vsc.map(v => (v / 78.0) * 4.7);
            traces = [
              { x: vsc, y: isc, type: 'scatter', mode: 'lines+markers', line: { color: '#38bdf8', width: 2.5 }, name: 'Short Circuit Isc vs Vsc' }
            ];
            layout.xaxis = { title: "Applied Voltage Vsc (V)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };

        } else if (activeExp === "exp3") {
          if (curveType === "speed-voltage") {

            const spdLoaded = volts.map(v => 1440 - (1 - (v / 415)**2) * 110);
            traces = [
              { x: volts, y: spdNoLoad, type: 'scatter', mode: 'lines+markers', line: { color: '#10b981', width: 2.5 }, name: 'Speed (No Load)' },
              { x: volts, y: spdLoaded, type: 'scatter', mode: 'lines+markers', line: { color: '#f59e0b', width: 2.5 }, name: 'Speed (Full Load)' }
            ];
            layout.xaxis = { title: "Stator Line Voltage (V)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
            layout.yaxis = { title: "Rotor Speed (RPM)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
          } else if (curveType === "speed-rotor") {
            const rext = [0, 0.5, 1.0, 1.5, 2.0, 3.0, 4.0, 5.0];
            const spd = rext.map(r => Math.max(900, 1440 - r * 72));
            traces = [
              { x: rext, y: spd, type: 'scatter', mode: 'lines+markers', line: { color: '#38bdf8', width: 3 }, name: 'Speed vs External Rotor Resistance' }
            ];
            layout.xaxis = { title: "External Rotor Resistance Rext (Ω/phase)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
            layout.yaxis = { title: "Rotor Speed (RPM)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
          } else {
            const poles = [2, 4, 6, 8];
            const ns = poles.map(p => 120 * 50 / p);
            const nr = ns.map(s => s * 0.96);
            traces = [
              { x: poles, y: ns, type: 'bar', marker: { color: '#6366f1' }, name: 'Synchronous Speed Ns' },
              { x: poles, y: nr, type: 'bar', marker: { color: '#eab308' }, name: 'Operating Speed Nr' }
            ];
            layout.xaxis = { title: "Number of Stator Poles (P)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
            layout.yaxis = { title: "Speed (RPM)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
          }

        } else if (activeExp === "exp5") {
          const ia = [0, 0.8, 1.6, 2.4, 3.2, 4.0, 4.8];
          if (curveType === "vt-ia-load") {
            const vtUnity = ia.map(i => 415 - i * 5.2);
            const vtLag = ia.map(i => 415 - i * 11.8);
            const vtLead = ia.map(i => 415 + i * 4.6);
            traces = [
              { x: ia, y: vtUnity, type: 'scatter', mode: 'lines+markers', line: { color: '#10b981', width: 2.5 }, name: 'Unity Power Factor' },
              { x: ia, y: vtLag, type: 'scatter', mode: 'lines+markers', line: { color: '#ef4444', width: 2.5 }, name: '0.8 Lagging PF' },
              { x: ia, y: vtLead, type: 'scatter', mode: 'lines+markers', line: { color: '#06b6d4', width: 2.5 }, name: '0.8 Leading PF' }

          } else {
            const pOut = ia.map(i => Math.sqrt(3) * 415 * i * 0.85);

        } else if (activeExp === "exp6_a") {

          if (curveType === "occ-scc") {

            traces = [

          } else {
            const zs = ifVals.map(i => {
              const e_ph = (i < 0.6 ? i * 500 : 300 + (1 - Math.exp(-(i-0.6)*2.5))*145) / Math.sqrt(3);
              const i_sc = i * 4.3 / 0.75;
              return e_ph / i_sc;
            });

          if (curveType === "v-curves") {

          } else {

            const pfP1 = ifArr.map(i => Math.max(0.2, 1.0 - Math.abs(i - 0.95) * 0.75));
            const pfP2 = ifArr.map(i => Math.max(0.3, 1.0 - Math.abs(i - 1.05) * 0.60));
            traces = [
              { x: ifArr, y: pfP0, type: 'scatter', mode: 'lines+markers', line: { color: '#38bdf8', width: 2.5 }, name: 'Inverted V (No Load)' },
              { x: ifArr, y: pfP1, type: 'scatter', mode: 'lines+markers', line: { color: '#fbbf24', width: 2.5 }, name: 'Inverted V (1.0 kW)' },
              { x: ifArr, y: pfP2, type: 'scatter', mode: 'lines+markers', line: { color: '#f43f5e', width: 2.5 }, name: 'Inverted V (2.0 kW)' }
            ];
            layout.xaxis = { title: "Field Current If (A)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
            layout.yaxis = { title: "Operating Power Factor (cos φ)", gridcolor: "rgba(255,255,255,0.06)", color: "#94a3b8" };
          }
        }

        Plotly.newPlot(containerRef.current, traces, layout, { responsive: true, displayModeBar: false });
      }, [curveType, activeExp, voltage, frequency, currentSlip, aIf, aIa, aSpeed, currentPower, sem5PhysicsResults]);

                <button onClick={() => setCurveType("zs-if")} className={`px-3 py-1 rounded border font-bold uppercase transition-all ${curveType === 'zs-if' ? 'bg-indigo-950 border-indigo-500 text-yellow-400' : 'bg-slate-900 border-slate-800 text-slate-400'}`}>Synchronous Impedance Zs</button>

          case "exp8":

    // Component: Alternator Interactive Phasor Diagram
    function PhasorDiagram({ aIa, aPF, aRa, aXs, vt_ph, Eph }) {
      const canvasRef = useRef(null);

      useEffect(() => {
        const svg = canvasRef.current;
        if (!svg) return;

        const theta = Math.acos(Math.abs(aPF)) * (aPF < 0 ? 1 : -1); 

        const vScale = 0.8;
        const iScale = 15;
        const impedanceScale = 4.0;

        const vt_x = vt_ph * vScale;
        const vt_y = 0;

        const ia_x = 5.0 * iScale * Math.cos(theta);
        const ia_y = 5.0 * iScale * Math.sin(theta);

        const ira_x = aIa * aRa * impedanceScale * Math.cos(theta);
        const ira_y = aIa * aRa * impedanceScale * Math.sin(theta);

        const ixs_x = aIa * aXs * impedanceScale * 0.45 * Math.cos(theta + Math.PI / 2);
        const ixs_y = aIa * aXs * impedanceScale * 0.45 * Math.sin(theta + Math.PI / 2);

        const ef_x = vt_x + ira_x + ixs_x;
        const ef_y = vt_y + ira_y + ixs_y;

        svg.innerHTML = `
          <!-- grids -->
          <line x1="20" y1="210" x2="380" y2="210" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
          <line x1="50" y1="20" x2="50" y2="250" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" />
          <circle cx="50" cy="210" r="4" fill="#64748b" />
          
          <!-- Current vector Ia -->
          <line x1="50" y1="210" x2="${50 + ia_x}" y2="${210 - ia_y}" stroke="#94a3b8" stroke-width="2" stroke-dasharray="3" />
          <polygon points="${50 + ia_x},${210 - ia_y} ${45 + ia_x},${215 - ia_y} ${47 + ia_x},${205 - ia_y}" fill="#94a3b8" />
          <text x="${60 + ia_x}" y="${210 - ia_y}" fill="#cbd5e1" font-size="9" font-weight="bold" font-family="Space Grotesk">Ia</text>

          <!-- Terminal Voltage Vt vector -->
          <line x1="50" y1="210" x2="${50 + vt_x}" y2="210" stroke="#3b82f6" stroke-width="3" />
          <polygon points="${50 + vt_x},210 ${42 + vt_x},206 ${42 + vt_x},214" fill="#3b82f6" />
          <text x="${60 + vt_x}" y="213" fill="#3b82f6" font-size="10" font-weight="bold" font-family="Space Grotesk">Vt</text>

          <!-- Ia*Ra resistive vector -->
          <line x1="${50 + vt_x}" y1="210" x2="${50 + vt_x + ira_x}" y2="${210 - ira_y}" stroke="#eab308" stroke-width="2.5" />
          <polygon points="${50 + vt_x + ira_x},${210 - ira_y} ${45 + vt_x + ira_x},${215 - ira_y} ${45 + vt_x + ira_x},${205 - ira_y}" fill="#eab308" />
          <text x="${50 + vt_x + ira_x + 5}" y="${210 - ira_y - 5}" fill="#eab308" font-size="8" font-family="Space Grotesk">Ia*Ra</text>

          <!-- jIa*Xs reactance vector -->
          <line x1="${50 + vt_x + ira_x}" y1="${210 - ira_y}" x2="${50 + ef_x}" y2="${210 - ef_y}" stroke="#ef4444" stroke-width="2.5" />
          <text x="${50 + ef_x + 5}" y="${210 - ef_y + 10}" fill="#ef4444" font-size="8" font-family="Space Grotesk">jIa*Xs</text>

          <!-- Generated EMF Ef vector -->
          <line x1="50" y1="210" x2="${50 + ef_x}" y2="${210 - ef_y}" stroke="#10b981" stroke-width="3" />
          <polygon points="${50 + ef_x},${210 - ef_y} ${43 + ef_x},${215 - ef_y} ${47 + ef_x},${203 - ef_y}" fill="#10b981" />
          <text x="${60 + ef_x}" y="${210 - ef_y - 5}" fill="#10b981" font-size="10" font-weight="bold" font-family="Space Grotesk">Eph</text>
        `;
      }, [aIa, aPF, aRa, aXs, vt_ph, Eph]);

      return (
        <svg ref={canvasRef} width="100%" height="260" viewBox="0 0 400 260" className="max-w-[400px]"></svg>
      );
    }

      showFlux, 
      showRotation,

      const motorSpeedRef = useRef(motorSpeed);
      const altSpeedRef = useRef(altSpeed);
      const fluxIntensityRef = useRef(fluxIntensity);

      useEffect(() => {
        motorSpeedRef.current = motorSpeed;
        altSpeedRef.current = altSpeed;
        fluxIntensityRef.current = fluxIntensity;
        showFluxRef.current = showFlux;
        showRotationRef.current = showRotation;
        showCutawayRef.current = showCutaway;
        showThermalRef.current = showThermal;
        motorS1Ref.current = motorS1;
        motorS2Ref.current = motorS2;
        loadTorqueRef.current = loadTorque;
        expStateRef.current = expState;
      }, [motorSpeed, altSpeed, fluxIntensity, showFlux, showRotation, showCutaway, showThermal, motorS1, motorS2, loadTorque, expState]);

      useEffect(() => {
        if (!mountRef.current) return;
        const container = mountRef.current;
        const width = container.clientWidth;
        const height = container.clientHeight || 480;

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050b14, 0.025);

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(4.5, 3.2, 5.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
        renderer.setSize(width, height);
        renderer.shadowMap.enabled = true;
        renderer.setPixelRatio(window.devicePixelRatio);
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 2.0;
        controls.maxDistance = 18;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Bright industrial laboratory lighting
        scene.add(new THREE.AmbientLight(0xffffff, 1.4));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.8);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Accent spotlights
        const spot1 = new THREE.SpotLight(0x3b82f6, 4, 25);
        spot1.position.set(-6, 8, -6);
        scene.add(spot1);

        const spot2 = new THREE.SpotLight(0xd97706, 3, 25);
        spot2.position.set(6, 8, 6);
        scene.add(spot2);

        // Laboratory Floor Grid
        const gridHelper = new THREE.GridHelper(50, 50, 0x4f46e5, 0x1e1b4b);
        gridHelper.position.y = -0.01;
        scene.add(gridHelper);

        // Heavy Industrial Steel Test Bench Table
        const benchTable = new THREE.Mesh(
          new THREE.BoxGeometry(7.5, 0.6, 5.2),
          new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.9, roughness: 0.2 })
        );
        benchTable.position.set(0, -0.3, 0.1);
        scene.add(benchTable);

        // Ambient Dust Particle Field
        const particleCount = 60;
        const pGeom = new THREE.BufferGeometry();
        const pPositions = new Float32Array(particleCount * 3);
        for(let i=0; i<particleCount*3; i+=3) {
          pPositions[i] = (Math.random() - 0.5) * 16;
          pPositions[i+1] = Math.random() * 5;
          pPositions[i+2] = (Math.random() - 0.5) * 16;
        }
        pGeom.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));
        const pMat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.04, transparent: true, opacity: 0.4 });
        const dust = new THREE.Points(pGeom, pMat);
        scene.add(dust);

        // Determine exact active experiment for 3D apparatus setup
        const activeExp = selectedExpId || (facility === "motor" ? "exp2" : "exp5");

        // Build exact Semester-5 Physical Laboratory Apparatus
        let setupRoot = new THREE.Group();
        let rotatingMeshes = [];

        if (window.Sem5Lab3D && typeof window.Sem5Lab3D.buildSetupForExperiment === "function") {
          const setup = window.Sem5Lab3D.buildSetupForExperiment(activeExp);
          setupRoot = setup.root;
          rotatingMeshes = setup.rotatingObjects || [];
        }
        setupRoot.position.set(0, 0.3, 0);
        scene.add(setupRoot);

        // Raycasting for interactive component hover & inspection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const onMouseMove = (e) => {
          const rect = renderer.domElement.getBoundingClientRect();
          mouse.x = ((e.clientX - rect.left) / width) * 2 - 1;
          mouse.y = -((e.clientY - rect.top) / height) * 2 + 1;

          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(setupRoot.children, true);
          if (intersects.length > 0) {
            let hit = intersects[0].object;
            while (hit && (!hit.userData || !hit.userData.name) && hit !== setupRoot) {
              hit = hit.parent;
            }
            if (hit && hit.userData && hit.userData.name) {
              setHoveredPart(hit.userData.name);
              renderer.domElement.style.cursor = 'pointer';
            } else {
              setHoveredPart("No Component Selected");
              renderer.domElement.style.cursor = 'default';
            }
          } else {
            setHoveredPart("No Component Selected");
            renderer.domElement.style.cursor = 'default';
          }
        };
        window.addEventListener("mousemove", onMouseMove);

        const onCanvasClick = (e) => {
          raycaster.setFromCamera(mouse, camera);
          const intersects = raycaster.intersectObjects(setupRoot.children, true);
          if (intersects.length > 0) {
            let hit = intersects[0].object;
            while (hit && (!hit.userData || !hit.userData.name) && hit !== setupRoot) {
              hit = hit.parent;
            }
            if (hit && hit.userData && hit.userData.name && onSelectComponent) {
              const liveVals = typeof hit.userData.getValues === 'function' 
                ? hit.userData.getValues(expStateRef.current || {}) 
                : (hit.userData.values || {});
              onSelectComponent({
                name: hit.userData.name,
                category: hit.userData.category || "Laboratory Apparatus",
                purpose: hit.userData.purpose || "Semester-5 Physical Apparatus",
                explanation: hit.userData.explanation || "Apparatus strictly conforming to machineslabmaterials-sem-5 specifications.",
                values: liveVals
              });
            }
          }
        };
        renderer.domElement.addEventListener("click", onCanvasClick);

        let animationId;
        const clock = new THREE.Clock();

        const animate = () => {
          animationId = requestAnimationFrame(animate);
          const time = clock.getElapsedTime();
          const delta = clock.getDelta();

          const activeSpeed = (activeExp === "exp2" || activeExp === "exp3") 
            ? motorSpeedRef.current 
            : (activeExp === "exp6_b" ? (expStateRef.current?.speed || 1550) : altSpeedRef.current);
          const speedFactor = activeSpeed / 1500;

          // Physical shaft & rotor rotation
          if (showRotationRef.current && rotatingMeshes.length > 0) {
            rotatingMeshes.forEach(mesh => {
              if (mesh) {
                if (mesh.rotation.x !== 0) {
                  mesh.rotation.y += delta * 20 * speedFactor;
                } else {
                  mesh.rotation.z += delta * 20 * speedFactor;
                }
              }
            });
          }

          // Cutaway view & heat mapping dynamic toggles
          const cutawayVal = showCutawayRef.current;
          const thermalVal = showThermalRef.current;
          setupRoot.traverse((child) => {
            if (child.isMesh && child.material) {
              if (child.userData && child.userData.name && (child.userData.name.includes("Stator") || child.userData.name.includes("Casing"))) {
                child.material.transparent = cutawayVal;
                child.material.opacity = cutawayVal ? 0.25 : 1.0;
                if (thermalVal) {
                  child.material.color.setHex(0xef4444);
                }
              }
            }
          });

          // Animate particle field
          const posArr = pGeom.attributes.position.array;
          for (let i = 1; i < posArr.length; i += 3) {
            posArr[i] -= 0.004;
            if (posArr[i] < 0) posArr[i] = 5;
          }
          pGeom.attributes.position.needsUpdate = true;

          controls.update();
          renderer.render(scene, camera);
        };
        animate();

        const handleResize = () => {
          if (!mountRef.current) return;
          const w = mountRef.current.clientWidth;
          const h = mountRef.current.clientHeight || 480;
          camera.aspect = w / h;
          camera.updateProjectionMatrix();
          renderer.setSize(w, h);
        };
        window.addEventListener("resize", handleResize);

        return () => {
          cancelAnimationFrame(animationId);
          window.removeEventListener("mousemove", onMouseMove);
          renderer.domElement.removeEventListener("click", onCanvasClick);
          window.removeEventListener("resize", handleResize);
          renderer.dispose();
          if (container) container.innerHTML = "";
        };
      }, [facility, selectedExpId]);

      return (
        <div className="w-full h-full relative select-none">
          <div ref={mountRef} className="w-full h-full"></div>
        </div>
      );
    }

    function HeroSection({ setView, setActiveFacility, setSelectedExpId, selectedDataset, setSelectedDataset, motorSpeed, altSpeed, currentUser, setCurrentUser, setShowAdminSettings }) {
      const handleLaunchExperiment = (expId, facility) => {
        const overlay = document.getElementById("transition-overlay");
        if (overlay) {
          overlay.classList.remove("pointer-events-none");
          overlay.style.opacity = "1";
        }

        setTimeout(() => {
          if (setSelectedExpId) setSelectedExpId(expId);
          if (setActiveFacility) setActiveFacility(facility);
          setView("dashboard");
          if (overlay) {
            overlay.style.opacity = "0";
            overlay.classList.add("pointer-events-none");
          }
        }, 700);
      };

      const LandingHeroComp = (window.DigitalTwinApp && window.DigitalTwinApp.LandingHero) || (window.DigitalTwinTS && window.DigitalTwinTS.LandingHero);

      if (LandingHeroComp) {
        return (
          <div className="w-full h-full relative">
            <LandingHeroComp 
              onLaunchExperiment={handleLaunchExperiment} 
              currentUser={currentUser}
              onLogout={() => {
                if (setCurrentUser) setCurrentUser(null);
                setView("login");
              }}
              onOpenAdmin={() => {
                if (setShowAdminSettings) setShowAdminSettings(true);
              }}
            />
          </div>
        );
      }

      return (
        <div className="w-full h-full flex flex-col items-center justify-center bg-slate-950 text-yellow-400 font-mono text-sm space-y-3">
          <i className="fa-solid fa-atom fa-spin text-4xl text-indigo-400"></i>
          <div>Loading Semester-5 Virtual Space Engine...</div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);

  </script>
</body>
</html>
